<!DOCTYPE html>
<html>
<head>
    <title>Teste SignalR</title>
</head>
<body>

<h2>Teste SignalR</h2>

<input type="number" id="ticketId" placeholder="Ticket ID" />
<button onclick="join()">Entrar no Ticket</button>

<br><br>

<input type="text" id="message" placeholder="Mensagem" />
<button onclick="send()">Enviar</button>

<ul id="messages"></ul>

<script src="http://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>

<script>
    const connection = new signalR.HubConnectionBuilder()
        .withUrl("http://localhost:5248/messageHub")
        .build();

    connection.on("ReceiveMessage", (msg) => {
        const li = document.createElement("li");
        li.textContent = `[Ticket ${msg.idTicket}] ${msg.texto}`;
        document.getElementById("messages").appendChild(li);
    });

    async function start() {
        try {
            await connection.start();
            console.log("Conectado ao SignalR");
        } catch (err) {
            console.error(err);
        }
    }

    start();

    async function join() {
        const ticketId = parseInt(document.getElementById("ticketId").value);
        await connection.invoke("JoinTicketGroup", ticketId);
        alert("Entrou no ticket " + ticketId);
    }

    async function send() {
        const message = document.getElementById("message").value;
        const ticketId = parseInt(document.getElementById("ticketId").value);

        await fetch("http://localhost:5248/api/message/send", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuario: 1,
                idTicket: ticketId,
                texto: message
            })
        });
    }
</script>

</body>
</html>
